name: Verify CiteDeck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Validate deployment configuration files
        run: |
          python -c "import tomllib; tomllib.load(open('.streamlit/config.toml', 'rb'))"
          python -c "import yaml; yaml.safe_load(open('render.yaml')); yaml.safe_load(open('compose.yaml'))"
      - name: Run deterministic unit and presentation tests
        run: python -m unittest discover -s tests -v
      - name: Lint maintained production code
        run: ruff check .
